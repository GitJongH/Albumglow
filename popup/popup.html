<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Albumglow</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <section>
    <h2>프리셋</h2>
    <div class="presets" id="presets">
      <button data-preset="apple">애플 뮤직</button>
      <button data-preset="deep">딥 다크</button>
      <button data-preset="custom">단색 강조색</button>
    </div>
    <label class="row" id="accentRow">
      <span>강조색</span>
      <input type="color" id="accent">
    </label>
  </section>

  <section>
    <label class="row">
      <span>블러 세기</span>
      <input type="range" id="blur" min="0" max="60">
    </label>
    <label class="row">
      <span>그라데이션 세기</span>
      <input type="range" id="intensity" min="0" max="100">
    </label>
  </section>

  <p class="hint">단축키: Alt+Shift+Y (chrome://extensions/shortcuts 에서 확인/변경)</p>
  <script src="popup.js"></script>
</body>
</html>
